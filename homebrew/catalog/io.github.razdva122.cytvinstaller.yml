shortDescription: Install and maintain Clean Your TV Root on a compatible rooted LG TV.
description: |
  Choose **Install and activate** to set up Clean Your TV on a compatible
  rooted TV. Once installed, the same tile opens your Home. For an older
  installation, continue on the computer when prompted. If Python is needed, the confirmation
  includes preparing it before the compatibility checks. An active emergency stop keeps Root Home disabled.
  The maintenance screen lets you restore LG Home.

  ### Before you start

  Your TV must already be rooted. Homebrew Channel must be able to run the
  Installer's status check with root privileges. On webOS 11 or later, use
  Homebrew Channel 0.8.0 or later. If the app reports access denied, update
  Homebrew and choose **Check status**. The desktop and Android installers
  are also available.

  Setup requires webOS 5.0 or later with Node.js 8 or later and a compatible Python 3.9 or later.
  The package includes an offline Python runtime for supported ARMv7 TVs.
  Preparing that runtime requires at least 320 MiB free after installing CYTV
  Installer. Allow additional space for the installer and product packages.

  ### Updates and removal

  Homebrew Channel updates the Installer app. Clean Your TV's System Updater
  handles complete product updates. Removing the Installer leaves Clean Your TV
  installed. To remove the product, use the complete removal action in the
  Installer or the computer installer.

