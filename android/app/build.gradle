plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

def appBuildDir = layout.buildDirectory
def stagedAssets = appBuildDir.dir('generated/cytv/assets')
def stagedPython = appBuildDir.dir('generated/cytv/python')

android {
    namespace 'com.cleanyourtv.android'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'com.cleanyourtv.android'
        minSdk 24
        targetSdk 35
        versionCode 55
        versionName '0.23.2'
        testInstrumentationRunner 'com.cleanyourtv.android.OperationChecks'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            if (System.getenv('CYTV_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('CYTV_ANDROID_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
        }
    }
    sourceSets {
        main.assets.srcDir stagedAssets
    }
}

chaquopy {
    defaultConfig {
        version '3.12'
        if (System.getenv('CYTV_BUILD_PYTHON')) { buildPython System.getenv('CYTV_BUILD_PYTHON') }
        pip {
            install 'paramiko==3.5.1'
            install 'websockets==15.0.1'
            install 'cryptography==42.0.8'
            install 'bcrypt==3.2.2'
            install 'PyNaCl==1.5.0'
        }
        extractPackages 'cytv'
    }
    sourceSets {
        main { srcDir stagedPython }
    }
}

tasks.register('stageCytv', Exec) {
    def checkout = rootProject.projectDir.parentFile
    def python = System.getenv('CYTV_BUILD_PYTHON') ?: 'python3'
    def stageCommand = [python, '-B', 'android/stage.py', '--build-dir', appBuildDir.get().asFile.absolutePath]
    def stagedInputs = providers.exec {
        workingDir checkout
        commandLine stageCommand + '--describe-inputs'
    }.standardOutput.asText.map { new groovy.json.JsonSlurper().parseText(it) }

    workingDir checkout
    commandLine stageCommand
    inputs.files(stagedInputs.map { spec ->
        (spec.pythonSources + spec.nativeSources + spec.payloadFiles).collect { new File(checkout, it) }
    })
    inputs.file rootProject.file('stage.py')
    inputs.file rootProject.file('../release-versions.json')
    inputs.property('sourceCommit', providers.exec {
        workingDir checkout
        commandLine 'git', 'rev-parse', 'HEAD'
    }.standardOutput.asText)
    outputs.dir stagedPython
    outputs.dir stagedAssets
    outputs.upToDateWhen { stagedInputs.get().outputsMatch }
}
tasks.configureEach {
    if ((name.startsWith('generate') || name.startsWith('merge')) && name.endsWith('PythonSources')) dependsOn 'stageCytv'
    if (name == 'preBuild') dependsOn 'stageCytv'
    if (name == 'packageRelease') {
        dependsOn 'requireReleaseSigner'
    }
}

tasks.register('requireReleaseSigner') {
    doLast {
        if (!System.getenv('CYTV_ANDROID_KEYSTORE')) {
            throw new GradleException('CYTV_ANDROID_KEYSTORE is required for a signed release APK')
        }
    }
}
