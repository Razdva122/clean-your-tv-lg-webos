name: cytv installer problem
description: Report a failed installation, connection or recovery step.
title: '[cytv] '
body:
  - type: markdown
    attributes:
      value: |
        Use what you already observed. Do not repeat installation or run another check to fill in this form.
  - type: textarea
    id: reproduction
    attributes:
      label: What were you trying to do?
      description: Name the installer step or command and what you expected to happen. Leave out addresses and key paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is visible now?
      description: Describe what the installer or TV shows. If you could not connect to the TV or save a report, say where you got stuck and describe any visible error without private details.
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Saved diagnostic report
      description: Attach the existing JSON report. If Save diagnostic report is still available for this attempt, use it to save and attach the report.
  - type: input
    id: details
    attributes:
      label: Details missing from the report
      description: If a detail is missing or you have no report, add what you know about the edition (No-root or Root), installer version and platform, and TV model and firmware. Leave out serial numbers.
