name: cytv installer problem
description: Report a failed installation, connection or recovery step.
title: '[cytv] '
body:
  - type: markdown
    attributes:
      value: |
        Attach the existing diagnostic JSON saved after the failed attempt or recovery check.
        Do not repeat installation or run another diagnostic check just to fill this form.
        The report contains installer/OS versions, observed state and the failed step without raw exception text.
        Review it before posting. Never attach SSH keys, pairing tokens, your profile folder, IP addresses, SSIDs or app inventories.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - No-root
        - Root
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Installer device and operating system
      options:
        - Windows
        - macOS Apple Silicon
        - macOS Intel
        - Linux
        - Android phone or tablet
        - Other / unknown
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and firmware
      placeholder: 'Example: OLED55C3RLA, 43.21.71 (no serial number)'
  - type: textarea
    id: reproduction
    attributes:
      label: What did you do?
      description: Name the wizard step or cytv command without addresses/key paths. Describe the state you already observed; do not repeat a failed setup.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report and error message
      description: Attach the existing diagnostic JSON after reviewing it, or say it is unavailable. Include the installer version if no report was saved. Do not attach private profiles, keys or raw logs.
    validations:
      required: true
