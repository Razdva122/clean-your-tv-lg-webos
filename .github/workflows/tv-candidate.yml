name: Direct Root TV candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit at the selected branch; preliminary Root device QA only
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: root-tv-candidate-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build-root-tv:
    name: build-root-tv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require exact dispatch source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] && [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [[ "$GITHUB_REF" == refs/heads/* ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/build-requirements.txt
            cytv/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r scripts/build-requirements.txt
      - name: Check direct artifact admission
        run: |
          python -m unittest discover -s tests/setup -p test_direct_tv_candidate.py
          node tests/updates/root-candidate-signing.cjs
      - name: Select affected TV safety checks
        id: safety_scope
        env:
          CI_QUICK_SUITE: true
        run: python scripts/ci-scope.py
      - name: Install behavioral TV test dependencies
        if: steps.safety_scope.outputs.tv == 'true' || steps.safety_scope.outputs.tv_runtime == 'true'
        run: python -m pip install -r cytv/requirements.txt
      - name: Prepare pinned legacy Node.js for Helper regression
        if: steps.safety_scope.outputs.tv == 'true' || steps.safety_scope.outputs.tv_runtime == 'true'
        uses: ./.github/actions/legacy-node
      - name: Verify affected TV safety
        env:
          TV_REQUIRED: ${{ steps.safety_scope.outputs.tv == 'true' || steps.safety_scope.outputs.tv_runtime == 'true' }}
        run: |
          test "$TV_REQUIRED" = true || test "$TV_REQUIRED" = false
          if [ "$TV_REQUIRED" = true ]; then
            scripts/test.sh tv
          else
            scripts/test.sh ui
          fi
      - name: Build and inspect production-format Root packages
        run: python scripts/build-tv-candidate.py --output "$RUNNER_TEMP/root-tv-candidate" --source "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: root-tv-candidate
          retention-days: 90
          path: ${{ runner.temp }}/root-tv-candidate/
          if-no-files-found: error
          overwrite: true
