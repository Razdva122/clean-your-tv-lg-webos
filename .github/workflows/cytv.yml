name: cytv standalone builds
on:
  workflow_dispatch:
    inputs:
      full_candidate:
        description: 'Freeze this release/next source and build all release artifacts with complete validation'
        type: boolean
        required: false
        default: false
      test_build:
        description: 'Build draft installers from the selected repository branch for device feedback; no release acceptance or publication'
        type: boolean
        required: false
        default: false
      homebrew_candidate:
        description: 'Build an unpublished Homebrew installer for review and TV acceptance'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cytv-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.scope.outputs.candidate }}
      full: ${{ steps.scope.outputs.full }}
      installers: ${{ steps.scope.outputs.installers }}
      homebrew_required: ${{ steps.scope.outputs.homebrew_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        run: |
          python scripts/ci-scope.py
          python - <<'PY'
          import os, runpy
          selected=runpy.run_path('scripts/assemble-release.py')['selected_homebrew_approval']() is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('homebrew_required='+str(selected).lower()+'\n')
          PY
  validation:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      source_sha: ${{ github.sha }}
      full_suite: ${{ needs.scope.outputs.full == 'true' }}
  android:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and payload builder
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install -r cytv/requirements.txt ziglang==0.14.1
          python scripts/build-cytv.py --payload-only
          python -m unittest discover -s android/tests
      # Preserve the published APK identity so upgrades retain private recovery data.
      - name: Restore the persistent Android signer
        env:
          CYTV_PREVIEW_KEYSTORE: ${{ secrets.CYTV_ANDROID_PREVIEW_KEYSTORE_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('CYTV_PREVIEW_KEYSTORE', '')
          if not value:
              raise SystemExit('Persistent Android preview signing secret is required')
          path = Path(os.environ['RUNNER_TEMP']) / 'android-preview.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CYTV_ANDROID_KEYSTORE=' + str(path) + '\n')
          PY
      - name: Build and verify the Android release APK
        run: |
          export CYTV_BUILD_PYTHON="$(command -v python)"
          android/gradlew -p android :app:assembleRelease :app:lintRelease :app:assembleDebugAndroidTest --no-daemon
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk dist/android/cytv-android-arm64.apk
          python android/verify_release.py dist/android/cytv-android-arm64.apk --output dist/android/cytv-android-arm64.build.json
      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-preview.keystore"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: cytv-android-arm64
          path: dist/android/cytv-android-arm64*
          if-no-files-found: error
      - name: Retain the native Android verification runner
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: cytv-android-native-tests
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  build:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cytv-windows-x64
            binary: dist/cytv.exe
          - os: ubuntu-22.04
            asset: cytv-linux-x64
            binary: dist/cytv
          - os: macos-15
            asset: cytv-macos-arm64
            binary: dist/cytv
          - os: macos-15-intel
            asset: cytv-macos-x64
            binary: dist/cytv
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long repository paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 xvfb xauth
      - run: python -m pip install -r cytv/build-requirements.txt
      - run: python -m unittest discover -s tests/cytv -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build-cytv.py --desktop
      - name: Verify installed Linux desktop package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/cytv-linux-x64.deb
          /opt/clean-your-tv/cytv-desktop --check-runtime
          xvfb-run -a env QT_QPA_PLATFORM=xcb /opt/clean-your-tv/cytv-desktop --smoke-test
      - name: Verify redirected Windows console output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CYTV_CONSOLE_EXECUTABLE = (Resolve-Path dist/cytv.exe).Path
          python -m unittest discover -s tests/cytv -p test_console_encoding.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify extracted Windows desktop package
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cytv-desktop-smoke'
          Expand-Archive -LiteralPath dist/cytv-windows-x64-desktop.zip -DestinationPath $destination
          $exe = Join-Path $destination 'cytv-desktop/cytv-desktop.exe'
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($argument in @('--check-payload', '--check-runtime', '--smoke-test')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Windows desktop $argument failed: $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ matrix.asset }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ matrix.asset }}-desktop
          path: |
            dist/cytv-macos-*.zip
            dist/cytv-linux-x64.deb
            dist/cytv-windows-x64-desktop.zip
          if-no-files-found: error

  homebrew:
    needs: scope
    continue-on-error: ${{ needs.scope.outputs.homebrew_required != 'true' }}
    if: needs.scope.outputs.installers == 'true' || (github.event_name == 'workflow_dispatch' && inputs.homebrew_candidate)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build offline candidate without publishing
        run: |
          python - <<'PYTHON'
          import json, os, runpy, subprocess, sys
          from pathlib import Path
          from cytv.python_runtime import prime_cache
          from homebrew.build import build_payload, build_installer
          approval_path=Path('homebrew/release.json')
          versions=json.loads(Path('release-versions.json').read_text())
          tag='v'+versions['release']
          Path('build').mkdir(exist_ok=True)
          Path('dist').mkdir(exist_ok=True)
          subprocess.run([sys.executable,'root-edition/build.py','--output','build/homebrew-root','--version',versions['root']],check=True)
          subprocess.run([sys.executable,'root-edition/build_updater.py','--output','build/homebrew-updater'],check=True)
          subprocess.run([sys.executable,'system-updater/build.py','--output','build/homebrew-supervisor'],check=True)
          approval=json.loads(approval_path.read_text()) if approval_path.exists() else {}
          if approval.get('release') != tag: approval={}
          runtime=prime_cache(Path(os.environ['RUNNER_TEMP'])/'homebrew-python', print)
          build_payload('build/homebrew-root','build/homebrew-updater','build/homebrew-supervisor',runtime,'build/homebrew-payload')
          ipk=build_installer('build/homebrew-payload','dist/homebrew-candidate',approval.get('version','0.0.0'))
          gate=runpy.run_path('scripts/homebrew-manifest.py')
          ipk_url=approval.get('ipk_url',gate['ASSETS']+tag+'/'+ipk.name)
          icon_url=approval.get('icon_url','https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['GITHUB_SHA']+'/assets/icons/installer-256.png')
          value=gate['manifest'](ipk.read_bytes(),ipk_url,icon_url,approval.get('source_url',gate['REPOSITORY']))
          manifest=ipk.parent/gate['MANIFEST_NAME']
          manifest.write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          if approval: gate['verify_accepted'](ipk.read_bytes(),manifest.read_bytes(),approval)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: homebrew-candidate
          path: dist/homebrew-candidate/
          if-no-files-found: error
