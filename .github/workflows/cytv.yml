name: cytv standalone builds
on:
  workflow_dispatch:
    inputs:
      full_candidate:
        description: 'Freeze this release/next source and build all release artifacts with complete validation'
        type: boolean
        required: false
        default: false
      test_build:
        description: 'Build draft installers from the selected repository branch for device feedback; no release acceptance or publication'
        type: boolean
        required: false
        default: false
      homebrew_candidate:
        description: 'Build an unpublished Homebrew installer for review and TV acceptance'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cytv-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.scope.outputs.candidate }}
      full: ${{ steps.scope.outputs.full }}
      installers: ${{ steps.scope.outputs.installers }}
      homebrew_required: ${{ steps.scope.outputs.homebrew_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay affected guardian shutdown scenarios before platform builds
        if: inputs.full_candidate && github.ref == 'refs/heads/release/next'
        run: python scripts/check-candidate-guardian.py
      - name: Check release input boundaries and README before candidate builds
        if: inputs.full_candidate
        run: |
          python -m unittest discover -s tests/setup -p test_release_inputs.py
          python -m unittest discover -s tests/setup -p test_readme_release.py
      - id: scope
        run: |
          python scripts/ci-scope.py
          python - <<'PY'
          import os, runpy
          selected=runpy.run_path('scripts/assemble-release.py')['selected_homebrew_approval']() is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('homebrew_required='+str(selected).lower()+'\n')
          PY
      - name: Verify packaged Engine transition against the latest stable release
        if: steps.scope.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check-engine-transition.py
  validation:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/tests.yml
    with:
      source_sha: ${{ github.sha }}
      full_suite: ${{ needs.scope.outputs.full == 'true' }}
  android-package:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cytv/requirements.txt
            scripts/build-requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and payload builder
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install -r scripts/build-requirements.txt -r cytv/requirements.txt ziglang==0.14.1
          python scripts/build-cytv.py --payload-only
          python -m unittest discover -s android/tests
      # Preserve the published APK identity so upgrades retain private recovery data.
      - name: Restore the persistent Android signer
        env:
          CYTV_PREVIEW_KEYSTORE: ${{ secrets.CYTV_ANDROID_PREVIEW_KEYSTORE_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('CYTV_PREVIEW_KEYSTORE', '')
          if not value:
              raise SystemExit('Persistent Android preview signing secret is required')
          path = Path(os.environ['RUNNER_TEMP']) / 'android-preview.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CYTV_ANDROID_KEYSTORE=' + str(path) + '\n')
          PY
      - name: Build and verify the Android release APK
        run: |
          export CYTV_BUILD_PYTHON="$(command -v python)"
          android/gradlew -p android :app:assembleRelease :app:lintRelease :app:assembleDebugAndroidTest --no-daemon
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk dist/android/cytv-android-arm64.apk
          python android/verify_release.py dist/android/cytv-android-arm64.apk --output dist/android/cytv-android-arm64.build.json
      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-preview.keystore"
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: ${{ inputs.full_candidate && 90 || 14 }}
          name: android-before-smoke
          path: dist/android/cytv-android-arm64*
          if-no-files-found: error
      - name: Retain the native Android verification runner
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: ${{ inputs.full_candidate && 90 || 14 }}
          name: cytv-android-native-tests
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  android:
    needs: android-package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-before-smoke
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: cytv-android-native-tests
          path: dist/android-tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up the API 35 Google APIs emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/cytv-release-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avdmanager create avd --name cytv-release-smoke --package 'system-images;android-35;google_apis;x86_64' \
            --path "$ANDROID_AVD_HOME/cytv-release-smoke.avd" <<< 'no'
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx cytv-release-smoke
          sudo chmod a+rw /dev/kvm
      - name: Run the packaged installer bridge on a clean emulator
        shell: bash
        run: |
          apk=dist/android/cytv-android-arm64.apk
          report=dist/android/cytv-android-arm64.build.json
          printf '%s  %s\n' "$(jq -er '.sha256' "$report")" "$apk" | sha256sum -c -
          test "$(jq -er '.source_commit' "$report")" = "$GITHUB_SHA"
          test "$(jq -er '.signer_sha256' "$report")" = "$(cat android/preview-certificate.sha256)"

          emulator_log="$RUNNER_TEMP/cytv-emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd cytv-release-smoke -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$emulator_log" 2>&1 &
          emulator_pid=$!
          trap 'status=$?; kill "$emulator_pid" 2>/dev/null || true; if (( status != 0 )); then tail -80 "$emulator_log"; fi' EXIT
          timeout 240 bash -c 'adb -s emulator-5554 wait-for-device && until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'

          adb -s emulator-5554 shell getprop ro.product.cpu.abilist | grep -qw arm64-v8a
          # The userdebug emulator admits the separately signed test runner via
          # its root shell. The production APK and certificate stay intact.
          timeout 60 adb -s emulator-5554 root
          timeout 60 adb -s emulator-5554 wait-for-device
          test "$(adb -s emulator-5554 shell id -u)" = 0
          timeout 180 adb -s emulator-5554 install "$apk"
          timeout 60 adb -s emulator-5554 install dist/android-tests/app-debug-androidTest.apk
          python3 android/tests/native.py --serial emulator-5554 | tee "$RUNNER_TEMP/cytv-android-smoke.log"
          {
            printf '### Android installer smoke test\n\n'
            printf 'Fresh install on Google APIs API 35 with ARM64 translation.\n\n'
            jq -r '"APK SHA-256: \(.sha256) | versionCode: \(.android_version_code) | Signer SHA-256: \(.signer_sha256)"' "$report"
            printf '\n'
            grep '^PASS:' "$RUNNER_TEMP/cytv-android-smoke.log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the verified APK for candidate assembly
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: ${{ inputs.full_candidate && 90 || 14 }}
          name: cytv-android-arm64
          path: dist/android/cytv-android-arm64*
          if-no-files-found: error
  build:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cytv-windows-x64
            binary: dist/cytv.exe
          - os: ubuntu-22.04
            asset: cytv-linux-x64
            binary: dist/cytv
          - os: macos-15
            asset: cytv-macos-arm64
            binary: dist/cytv
          - os: macos-15-intel
            asset: cytv-macos-x64
            binary: dist/cytv
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long repository paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cytv/build-requirements.txt
            cytv/requirements.txt
            scripts/build-requirements.txt
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-ubuntu-mirror.sh
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 xvfb xauth
      - run: python -m pip install -r cytv/build-requirements.txt
      - name: Select fresh desktop installer host tests from authenticated evidence
        id: evidence
        env:
          QT_QPA_PLATFORM: offscreen
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-test-evidence.py plan --kind desktop --os "${{ matrix.os }}" --units installer-host --directory "${{ runner.temp }}/ci-evidence"
      - name: Test desktop installer host behavior
        if: steps.evidence.outputs.fresh == 'true'
        run: python scripts/test-shard.py -s tests/cytv -v --timings "${{ runner.temp }}/test-timings/cytv.json"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Retain installer host test timings and skip reasons
        if: always() && steps.evidence.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cytv-test-timings-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/test-timings/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Record freshly passed desktop installer host tests
        id: record
        continue-on-error: true
        if: steps.evidence.outputs.fresh == 'true' && inputs.full_candidate && github.ref == 'refs/heads/release/next' && github.run_attempt == 1
        env:
          QT_QPA_PLATFORM: offscreen
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-test-evidence.py record --directory "${{ runner.temp }}/ci-evidence"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: steps.record.outcome == 'success'
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ${{ runner.temp }}/ci-evidence/receipt.json
          retention-days: 2
          if-no-files-found: error
      - run: python scripts/build-cytv.py --desktop
      - name: Verify installed Linux desktop package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/cytv-linux-x64.deb
          /opt/clean-your-tv/cytv-desktop --check-runtime
          xvfb-run -a env QT_QPA_PLATFORM=xcb /opt/clean-your-tv/cytv-desktop --smoke-test
      - name: Verify redirected Windows console output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CYTV_CONSOLE_EXECUTABLE = (Resolve-Path dist/cytv.exe).Path
          python -m unittest discover -s tests/cytv -p test_console_encoding.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify extracted Windows desktop package
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cytv-desktop-smoke'
          Expand-Archive -LiteralPath dist/cytv-windows-x64-desktop.zip -DestinationPath $destination
          $exe = Join-Path $destination 'cytv-desktop/cytv-desktop.exe'
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($argument in @('--check-payload', '--check-runtime', '--smoke-test')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Windows desktop $argument failed: $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: ${{ inputs.full_candidate && 90 || 14 }}
          name: ${{ matrix.asset }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: ${{ inputs.full_candidate && 90 || 14 }}
          name: ${{ matrix.asset }}-desktop
          path: |
            dist/cytv-macos-*.zip
            dist/cytv-linux-x64.deb
            dist/cytv-windows-x64-desktop.zip
          if-no-files-found: error

  homebrew:
    needs: scope
    continue-on-error: ${{ needs.scope.outputs.homebrew_required != 'true' }}
    if: needs.scope.outputs.installers == 'true' || (github.event_name == 'workflow_dispatch' && inputs.homebrew_candidate)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/build-requirements.txt
      - run: python -m pip install -r scripts/build-requirements.txt ziglang==0.14.1 websockets==15.0.1
      - name: Build offline candidate without publishing
        run: |
          python - <<'PYTHON'
          import json, os, runpy, subprocess, sys
          from pathlib import Path
          from cytv.python_runtime import prime_cache
          from homebrew.build import build_payload, build_installer
          approval_path=Path('homebrew/release.json')
          versions=json.loads(Path('release-versions.json').read_text())
          tag='v'+versions['release']
          Path('build').mkdir(exist_ok=True)
          Path('dist').mkdir(exist_ok=True)
          subprocess.run([sys.executable,'root-edition/build.py','--single-tile','--output','build/homebrew-root','--version',versions['root']],check=True)
          subprocess.run([sys.executable,'root-edition/build_updater.py','--output','build/homebrew-updater'],check=True)
          subprocess.run([sys.executable,'system-updater/build.py','--single-tile','--output','build/homebrew-supervisor'],check=True)
          approval=json.loads(approval_path.read_text()) if approval_path.exists() else {}
          if approval.get('release') != tag: approval={}
          runtime=prime_cache(Path(os.environ['RUNNER_TEMP'])/'homebrew-python', print)
          build_payload('build/homebrew-root','build/homebrew-updater','build/homebrew-supervisor',runtime,'build/homebrew-payload')
          ipk=build_installer('build/homebrew-payload','dist/homebrew-candidate',approval.get('version','0.0.0'))
          gate=runpy.run_path('scripts/homebrew-manifest.py')
          ipk_url=approval.get('ipk_url',gate['ASSETS']+tag+'/'+ipk.name)
          icon_url=approval.get('icon_url','https://raw.githubusercontent.com/'+os.environ['GITHUB_REPOSITORY']+'/'+os.environ['GITHUB_SHA']+'/assets/icons/installer-256.png')
          value=gate['manifest'](ipk.read_bytes(),ipk_url,icon_url,approval.get('source_url',gate['REPOSITORY']))
          manifest=ipk.parent/gate['MANIFEST_NAME']
          manifest.write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          if approval: gate['verify_accepted'](ipk.read_bytes(),manifest.read_bytes(),approval)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          overwrite: true
          retention-days: ${{ (inputs.full_candidate || inputs.homebrew_candidate) && 90 || 14 }}
          name: homebrew-candidate
          path: dist/homebrew-candidate/
          if-no-files-found: error
