name: Release PR policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [cytv standalone builds]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: release-policy-${{ github.event.pull_request.base.ref == 'release/next' && github.event.pull_request.number || 'candidate' }}
  cancel-in-progress: false
jobs:
  policy:
    name: Validate release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block the PR head before checkout or external API reads
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            // Closed edits must not overwrite a gate shared with another open PR at this SHA.
            if (context.payload.pull_request.state !== 'open') return;
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: context.payload.pull_request.base.ref === 'release/next' ? 'Integration policy' : 'Release policy',
              state: 'pending', description: 'Validating current PR and candidate',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          # Privileged workflow runs only trusted main code. Candidate objects are data.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh policy without polling or executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-flow.py refresh-policy
