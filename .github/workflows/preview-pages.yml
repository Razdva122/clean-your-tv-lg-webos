name: Website and Preview Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.scope.outputs.preview }}
      linux_image: ${{ steps.linux-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: linux-image
        uses: ./.github/actions/linux-ci-image
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        run: python scripts/ci-scope.py
  build:
    needs: scope
    if: needs.scope.outputs.preview == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.scope.outputs.linux_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the runner-owned checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-ci-pip-${{ hashFiles('scripts/build-requirements.txt') }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r scripts/build-requirements.txt
      - run: npm ci --prefix website --ignore-scripts --no-audit --no-fund
      - name: Check and build multilingual website with unchanged launcher demo
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          npm run check --prefix website
          npm run build --prefix website
      - name: Verify the baked Playwright version
        run: test "$(node -p "require('playwright/package.json').version")" = "$PLAYWRIGHT_IMAGE_VERSION"
      - name: Verify localized navigation, mobile layout and demo
        env:
          BROWSER_CHANNEL: chromium
        run: |
          npm run test:browser --prefix website
          npm run test:dev --prefix website
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the current main commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping an outdated main build.'
          fi
      - uses: actions/configure-pages@v5
        if: steps.latest.outputs.deploy == 'true'
      - uses: actions/deploy-pages@v4
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
