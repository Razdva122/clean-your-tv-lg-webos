name: Tests
on:
  pull_request:
  workflow_call:
    inputs:
      full_suite:
        description: 'Complete frozen candidate validation; preliminary checks never grant this evidence'
        required: false
        type: boolean
        default: false
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.source_sha }}
  cancel-in-progress: ${{ inputs.source_sha == '' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.scope.outputs.any }}
      ui: ${{ steps.scope.outputs.ui }}
      macos: ${{ steps.scope.outputs.macos }}
      runtime_os: ${{ steps.scope.outputs.runtime_os }}
      runtime: ${{ steps.scope.outputs.runtime }}
      tv: ${{ steps.scope.outputs.tv }}
      tv_runtime: ${{ steps.scope.outputs.tv_runtime }}
      installer: ${{ steps.scope.outputs.installer }}
      android: ${{ steps.scope.outputs.android }}
      setup: ${{ steps.scope.outputs.setup }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        env:
          CI_FULL_SUITE: ${{ inputs.full_suite }}
          CI_QUICK_SUITE: ${{ inputs.source_sha != '' && !inputs.full_suite }}
        run: python scripts/ci-scope.py
  runtime:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.runtime_os) }}
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Explain selected platform checks
        if: needs.scope.outputs.any != 'true' || (runner.os != 'Linux' && needs.scope.outputs.macos != 'true')
        run: echo 'No affected platform runtime checks; release metadata is validated when present.'
      - uses: actions/checkout@v4
        if: needs.scope.outputs.any == 'true'
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.any == 'true' && (runner.os == 'Linux' || needs.scope.outputs.macos == 'true')
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.any == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/build-requirements.txt
            cytv/requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: needs.scope.outputs.any == 'true' && (runner.os == 'Linux' || needs.scope.outputs.macos == 'true')
      - run: python -m pip install -r scripts/build-requirements.txt
        if: needs.scope.outputs.any == 'true' && (runner.os == 'Linux' || needs.scope.outputs.macos == 'true')
      - run: python -m pip install -r cytv/requirements.txt
        if: needs.scope.outputs.any == 'true' && (runner.os == 'Linux' || needs.scope.outputs.macos == 'true')
      - name: Select fresh runtime units from authenticated evidence
        id: evidence
        if: (needs.scope.outputs.runtime == 'true' || needs.scope.outputs.setup == 'true') && (runner.os == 'Linux' || needs.scope.outputs.macos == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_OS: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}/4
          UI: ${{ needs.scope.outputs.ui }}
          TV: ${{ needs.scope.outputs.tv }}
          TV_RUNTIME: ${{ needs.scope.outputs.tv_runtime }}
          SETUP: ${{ needs.scope.outputs.setup }}
          INSTALLER: ${{ needs.scope.outputs.installer }}
          ANDROID: ${{ needs.scope.outputs.android }}
          PREVIEW: ${{ needs.scope.outputs.preview }}
        shell: bash
        run: |
          components=()
          [ "$UI" != true ] || components+=(ui)
          [ "$TV" != true ] || components+=(tv)
          [ "$TV_RUNTIME" != true ] || components+=(tv-runtime)
          [ "$SETUP" != true ] || components+=(setup)
          [ "$INSTALLER" != true ] || components+=(installer)
          [ "$ANDROID" != true ] || components+=(android)
          [ "$PREVIEW" != true ] || components+=(preview)
          python scripts/ci-test-evidence.py plan --kind runtime --os "$MATRIX_OS" --shard "$SHARD" --units "${components[*]}" --directory "$RUNNER_TEMP/ci-evidence"
      - name: Prepare pinned Zig compiler for installer support
        if: needs.scope.outputs.installer == 'true' && contains(format(' {0} ', steps.evidence.outputs.missing), ' installer ') && (runner.os == 'Linux' || needs.scope.outputs.macos == 'true')
        run: python -m pip install ziglang==0.14.1
      - name: Validate current release metadata independently of runtime reuse
        if: needs.scope.outputs.any == 'true'
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          RUN_SETUP: ${{ contains(format(' {0} ', steps.evidence.outputs.missing), ' setup ') }}
        run: |
          if [ "$RUN_SETUP" != true ] && [ "$SHARD_INDEX" = 1 ]; then
            python -m unittest discover -s tests/setup -p test_readme_release.py
          fi
          python - <<'PYTHON'
          import json, runpy
          from pathlib import Path
          runpy.run_path('scripts/release-flow.py')['validate_shape'](json.loads(Path('release-plan.json').read_text()))
          PYTHON
      - name: Prepare pinned Node 0.10.15, 0.10.25 and 0.12.2 for Helper regression
        if: runner.os == 'Linux' && (contains(format(' {0} ', steps.evidence.outputs.missing), ' tv-runtime ') || contains(format(' {0} ', steps.evidence.outputs.missing), ' installer '))
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location https://nodejs.org/dist/v0.10.15/node-v0.10.15-linux-x64.tar.gz --output node-v0.10.15-linux-x64.tar.gz
          echo '0b5191748a91b1c49947fef6b143f3e5e5633c9381a31aaa467e7c80efafb6e9  node-v0.10.15-linux-x64.tar.gz' | sha256sum --check -
          tar -xzf node-v0.10.15-linux-x64.tar.gz
          echo "NODE010=$RUNNER_TEMP/node-v0.10.15-linux-x64/bin/node" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location https://nodejs.org/dist/v0.10.25/node-v0.10.25-linux-x64.tar.gz --output node-v0.10.25-linux-x64.tar.gz
          echo '1dac61c21fa21e47fc6e799757569c6c3914897ca46fc8f4dd2c8f13f0400626  node-v0.10.25-linux-x64.tar.gz' | sha256sum --check -
          tar -xzf node-v0.10.25-linux-x64.tar.gz
          echo "NODE01025=$RUNNER_TEMP/node-v0.10.25-linux-x64/bin/node" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location https://nodejs.org/dist/v0.12.2/node-v0.12.2-linux-x64.tar.gz --output node-v0.12.2-linux-x64.tar.gz
          echo '4e1578efc2a2cc67651413a05ccc4c5d43f6b4329c599901c556f24d93cd0508  node-v0.12.2-linux-x64.tar.gz' | sha256sum --check -
          tar -xzf node-v0.12.2-linux-x64.tar.gz
          echo "NODE012=$RUNNER_TEMP/node-v0.12.2-linux-x64/bin/node" >> "$GITHUB_ENV"
      - name: Test affected runtime components
        if: steps.evidence.outputs.fresh == 'true'
        env:
          SHARD: ${{ matrix.shard }}/4
          MISSING: ${{ steps.evidence.outputs.missing }}
          CI_TEST_TIMINGS_DIR: ${{ runner.temp }}/test-timings
        shell: bash
        run: |
          read -r -a components <<< "$MISSING"
          if [ "${#components[@]}" -gt 0 ]; then
            scripts/test.sh --shard "$SHARD" "${components[@]}"
          fi
      - name: Retain installer test timings and skip reasons
        if: always() && steps.evidence.outputs.fresh == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cytv-test-timings-runtime-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify real webOS-style file ownership
        if: matrix.shard == 1 && runner.os == 'Linux' && contains(format(' {0} ', steps.evidence.outputs.missing), ' tv-runtime ')
        run: sudo "$(command -v node)" native/prototype/test-state-permissions-linux.cjs
      - name: Record freshly passed runtime units
        id: record
        continue-on-error: true
        if: steps.evidence.outputs.fresh == 'true' && github.run_attempt == 1 && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.full_suite && github.ref == 'refs/heads/release/next'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-test-evidence.py record --directory "$RUNNER_TEMP/ci-evidence"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: steps.record.outcome == 'success'
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ${{ runner.temp }}/ci-evidence/receipt.json
          retention-days: 2
          if-no-files-found: error
  optional-python:
    needs: scope
    if: needs.scope.outputs.installer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/python-runtime-cache
          key: root-python-4a71641c8d5536175e404a961624e8656eba30e97b5026f6bd7dc31e4bbeaaea
      - name: Install ARM user emulation and EABI sysroot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user libc6-armel-cross libgcc-s1-armel-cross
      - name: Select fresh ARM Python work
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-test-evidence.py plan --kind optional --os ubuntu-latest --units optional-python --directory "$RUNNER_TEMP/ci-evidence"
      - name: Execute the pinned ARM32 Python and native module smoke tests
        if: steps.evidence.outputs.fresh == 'true'
        run: python scripts/test-python-runtime.py
      - name: Verify shell provisioning boundaries as root
        if: steps.evidence.outputs.fresh == 'true'
        run: sudo "$(command -v python)" -m unittest tests.cytv.test_python_runtime
      - name: Record freshly passed ARM Python work
        id: record
        continue-on-error: true
        if: steps.evidence.outputs.fresh == 'true' && github.run_attempt == 1 && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.full_suite && github.ref == 'refs/heads/release/next'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-test-evidence.py record --directory "$RUNNER_TEMP/ci-evidence"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: steps.record.outcome == 'success'
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ${{ runner.temp }}/ci-evidence/receipt.json
          retention-days: 2
          if-no-files-found: error

  phone-heic:
    needs: scope
    if: needs.scope.outputs.tv == 'true' || needs.scope.outputs.ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browsers: webkit chromium
            engines: webkit,chromium
          - os: ubuntu-latest
            browsers: chromium firefox
            engines: chromium,firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Check actual HEIC decode and local phone upload
        env:
          HEIC_BROWSERS: ${{ matrix.engines }}
        run: npm run test:wallpaper:heic

  browser:
    needs: scope
    if: needs.scope.outputs.tv == 'true' || needs.scope.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/build-requirements.txt
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r scripts/build-requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Select fresh browser units
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ inputs.full_suite }}
        run: |
          units=browser-core
          if [ "$FULL" = true ]; then units="$units browser-themes"; fi
          python scripts/ci-test-evidence.py plan --kind browser --os ubuntu-latest --units "$units" --directory "$RUNNER_TEMP/ci-evidence"
      - name: Check compiled Home with legacy browser limitations
        if: contains(format(' {0} ', steps.evidence.outputs.missing), ' browser-core ')
        run: |
          python scripts/tv_web_build.py --input launcher --output build/legacy-ui
          BROWSER_CHANNEL=chromium TV_WEB_DIR=build/legacy-ui npm run test:legacy-ui
          BROWSER_CHANNEL=chromium TV_WEB_DIR=build/legacy-ui npm run test:geometry
      - name: Check Android failed-setup recovery and Root-removal handoff
        if: contains(format(' {0} ', steps.evidence.outputs.missing), ' browser-core ')
        run: BROWSER_CHANNEL=chromium CYTV_PYTHON=python node android/tests/auto-recovery-journey.cjs
      - name: Check settings categories and update indicators
        if: contains(format(' {0} ', steps.evidence.outputs.missing), ' browser-core ')
        run: |
          python scripts/preview.py --port 8876 > /tmp/cytv-settings-preview.log 2>&1 &
          settings_preview_pid=$!
          trap 'kill "$settings_preview_pid" 2>/dev/null || true' EXIT
          settings_preview_ready=false
          settings_preview_deadline=$((SECONDS + 180))
          while (( SECONDS < settings_preview_deadline )); do
            if ! kill -0 "$settings_preview_pid" 2>/dev/null; then
              cat /tmp/cytv-settings-preview.log
              wait "$settings_preview_pid" || true
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:8876/preview/version > /dev/null; then
              settings_preview_ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$settings_preview_ready" != true ]; then
            cat /tmp/cytv-settings-preview.log
            echo 'Preview did not become ready within 180 seconds' >&2
            exit 1
          fi
          BROWSER_CHANNEL=chromium node tests/settings-ui.cjs
          BROWSER_CHANNEL=chromium node tests/home-viewport-ui.cjs
          BROWSER_CHANNEL=chromium node tests/helper-panel-diagnostics.cjs --browser
          BROWSER_CHANNEL=chromium node tests/settings-update-badges.cjs
          BROWSER_CHANNEL=chromium PREVIEW_URL=http://127.0.0.1:8876 node root-edition/ui/test-settings-browser.cjs
      - name: Check compiled development UI isolation and themes
        if: contains(format(' {0} ', steps.evidence.outputs.missing), ' browser-core ')
        run: BROWSER_CHANNEL=chromium node tests/tv-dev-ui.cjs
      - name: Full theme browser regressions
        if: contains(format(' {0} ', steps.evidence.outputs.missing), ' browser-themes ')
        run: BROWSER_CHANNEL=chromium npm run test:themes:browser
      - name: Record freshly passed browser units
        id: record
        continue-on-error: true
        if: steps.evidence.outputs.fresh == 'true' && github.run_attempt == 1 && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.full_suite && github.ref == 'refs/heads/release/next'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci-test-evidence.py record --directory "$RUNNER_TEMP/ci-evidence"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: steps.record.outcome == 'success'
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: ${{ runner.temp }}/ci-evidence/receipt.json
          retention-days: 2
          if-no-files-found: error

  tests:
    needs: [scope, runtime, browser, optional-python]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          RUNTIME: ${{ needs.runtime.result }}
          BROWSER: ${{ needs.browser.result }}
          PYTHON: ${{ needs.optional-python.result }}
          BROWSER_REQUIRED: ${{ needs.scope.outputs.tv == 'true' || needs.scope.outputs.ui == 'true' }}
          PYTHON_REQUIRED: ${{ needs.scope.outputs.installer }}
        run: |
          test "$SCOPE" = success
          test "$RUNTIME" = success
          case "$BROWSER" in success|skipped) ;; *) exit 1 ;; esac
          case "$PYTHON" in success|skipped) ;; *) exit 1 ;; esac
          if [ "$BROWSER_REQUIRED" = true ]; then test "$BROWSER" = success; fi
          if [ "$PYTHON_REQUIRED" = true ]; then test "$PYTHON" = success; fi

  full-release:
    needs: [tests, browser, optional-python]
    if: always() && inputs.full_suite
    runs-on: ubuntu-latest
    steps:
      - name: Require complete frozen-source validation
        env:
          TESTS: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser.result }}
          PYTHON: ${{ needs.optional-python.result }}
          SOURCE: ${{ inputs.source_sha }}
        run: |
          test -n "$SOURCE"
          test "$TESTS" = success
          test "$BROWSER" = success
          test "$PYTHON" = success
          echo "Full release validation passed for $SOURCE"
