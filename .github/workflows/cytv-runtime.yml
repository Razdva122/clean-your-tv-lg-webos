name: Frozen desktop installer runtime
on:
  pull_request:
    paths:
      - 'cytv/__main__.py'
      - 'cytv/__init__.py'
      - 'cytv/cli.py'
      - 'cytv/desktop*.py'
      - 'cytv/gui.py'
      - 'cytv/gui_style.py'
      - 'cytv/wallpaper*.py'
      - 'cytv/licenses/**'
      - 'cytv/translations.py'
      - 'cytv/terminal.py'
      - 'cytv/runtime_check.py'
      - 'cytv/requirements.txt'
      - 'cytv/build-requirements.txt'
      - 'tests/cytv/test_console_encoding.py'
      - 'tests/cytv/test_wallpaper*.py'
      - 'tests/cytv/test_gui.py'
      - 'tests/cytv/test_desktop_package.py'
      - 'tests/cytv/test_runtime_check.py'
      - 'tests/cytv/test_long_ssh_commands.py'
      - 'launcher/theme-data.js'
      - 'launcher/theme-policy.js'
      - 'scripts/build-cytv.py'
      - 'scripts/desktop_packaging.py'
      - '.github/workflows/cytv-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
# Cancel superseded PR checks; explicit QA dispatches remain independent.
concurrency:
  group: cytv-runtime-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Enable long repository paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cytv/build-requirements.txt
            cytv/requirements.txt
            scripts/build-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r cytv/build-requirements.txt
      - name: Exercise long SSH commands through a local POSIX shell
        run: python -m unittest discover -s tests/cytv -p test_long_ssh_commands.py -v
      - name: Exercise wallpaper preparation, transfer, Qt and binary staging
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests/cytv -p 'test_wallpaper*.py' -v
      - name: Check desktop actions and maintenance layout
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests/cytv -p test_gui.py -v
      - name: Freeze and exercise both actual entrypoints without a TV payload
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root))
          from scripts.desktop_packaging import ffmpeg_bundle_args
          for kind, entry, flags in (
              ('console', '__main__.py', ['--onefile', '--console', '--exclude-module', 'imageio_ffmpeg']),
              ('gui', 'desktop_entry.py', ['--onedir', '--windowed']),
          ):
              name = 'cytv-runtime-' + kind
              output = root / 'dist' / kind
              subprocess.run([sys.executable, '-m', 'PyInstaller', '--noconfirm', '--clean',
                  *flags, *(ffmpeg_bundle_args(root) if kind == 'gui' else []), '--name', name, '--paths', str(root), '--distpath', str(output),
                  '--workpath', str(root / 'build' / kind), '--specpath', str(root / 'build' / kind),
                  str(root / 'cytv' / entry)], check=True)
              if sys.platform == 'win32':
                  executable = output / (name + '.exe') if kind == 'console' else output / name / (name + '.exe')
              else:
                  executable = (output / name if kind == 'console' else
                                output / (name + '.app') / 'Contents/MacOS' / name)
              subprocess.run([str(executable), '--check-runtime'], check=True)
              if kind == 'console':
                  import os
                  subprocess.run([sys.executable, '-m', 'unittest', 'discover', '-s', 'tests/cytv',
                      '-p', 'test_console_encoding.py', '-v'], check=True,
                      env=dict(os.environ, CYTV_CONSOLE_EXECUTABLE=str(executable)))
