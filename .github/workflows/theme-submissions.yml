name: Theme submissions

# Untrusted PRs receive validation artifacts only. No publishing token or deployment.
on:
  pull_request:
    paths:
      - 'showcase/**'
      - 'theme-api/**'
      - 'launcher/theme-policy.js'
      - 'scripts/check-theme-submissions.cjs'
      - 'scripts/compile-tv-web.cjs'
      - 'tests/showcase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/theme-submissions.yml'
      - '.github/actions/linux-ci-image/**'
      - '.github/ci-image/reference'
  push:
    branches: [main, release/next]
    paths:
      - 'showcase/**'
      - 'theme-api/**'
      - 'launcher/theme-policy.js'
      - 'scripts/check-theme-submissions.cjs'
      - 'scripts/compile-tv-web.cjs'
      - 'tests/showcase/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/theme-submissions.yml'
      - '.github/actions/linux-ci-image/**'
      - '.github/ci-image/reference'
  workflow_dispatch:
    inputs:
      verify_remote:
        description: Check pinned public source bytes as well as reviewed local bytes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: theme-submissions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      linux_image: ${{ steps.linux-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: linux-image
        uses: ./.github/actions/linux-ci-image
  validate:
    needs: scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.scope.outputs.linux_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the runner-owned checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install main-project tools without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-ci-pip-${{ hashFiles('scripts/build-requirements.txt') }}
      - run: python -m pip install -r scripts/build-requirements.txt
      - name: Test registry and data-only validation
        run: |
          node tests/showcase/registry.cjs
          node tests/showcase/submission-security.cjs
          node tests/showcase/remote.cjs
          node scripts/check-theme-submissions.cjs
      - name: Verify bounded commit-pinned public source bytes
        if: github.event_name != 'workflow_dispatch' || inputs.verify_remote
        run: timeout 180 node scripts/check-theme-submissions.cjs --remote
      - name: Verify the baked Playwright version
        run: test "$(node -p "require('playwright/package.json').version")" = "$PLAYWRIGHT_IMAGE_VERSION"
      - name: Test inline theme preview with blocked external requests
        run: BROWSER_CHANNEL=chromium node tests/preview-themes-ui.cjs
      - name: Build inline theme preview inspection artifact
        run: python3 scripts/preview.py --build build/theme-preview-review
      - uses: actions/upload-artifact@v4
        with:
          name: theme-preview-review
          path: build/theme-preview-review
          retention-days: 3
          if-no-files-found: error
