name: Automatic release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful candidate build run (empty finds the exact merged candidate)
        required: false
        type: string
      validate_only:
        description: Assemble and verify all packages without creating/publishing a release
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: automatic-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      build_run: ${{ steps.plan.outputs.build_run }}
      build_commit: ${{ steps.plan.outputs.build_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: source
        name: Verify successful candidate builds match the exact main merge
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          SOURCE_COMMIT: ${{ github.sha }}
        working-directory: release-tools
        shell: bash
        run: |
          args=(--build-source --source-commit "$SOURCE_COMMIT")
          [ -z "$BUILD_RUN" ] || args+=(--build-run "$BUILD_RUN")
          python scripts/assemble-release.py "${args[@]}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Plan a new version or skip an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.source.outputs.build_run }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          if [ "$VALIDATE_ONLY" = true ]; then
            python release-tools/scripts/assemble-release.py --plan --build-run "$BUILD_RUN" --validate-only
          else
            python release-tools/scripts/assemble-release.py --plan --build-run "$BUILD_RUN"
          fi
  assemble:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    timeout-minutes: 20
    env:
      RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: python -m pip install pyinstaller==6.22.3
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.plan.outputs.build_run }}
          github-token: ${{ github.token }}
          pattern: '{cytv-*,homebrew-candidate}'
          path: ${{ runner.temp }}/release-builds
      - name: Verify desktop and Android installers and assemble final public bundles
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BUILD_RUN: ${{ needs.plan.outputs.build_run }}
          BUILD_COMMIT: ${{ needs.plan.outputs.build_commit }}
        run: python release-tools/scripts/assemble-release.py --artifacts "$RUNNER_TEMP/release-builds" --output "$RUNNER_TEMP/release-assets" --build-commit "$BUILD_COMMIT"
      - name: Bind release inventory to the exact source and refresh checksums
        if: hashFiles('release-source/release-plan.json') != '' || inputs.validate_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python release-tools/scripts/release-flow.py inventory --source-root release-source --output "$RUNNER_TEMP/release-assets/RELEASE-INVENTORY.json"
      - name: Create or resume the draft from the exact build commit
        if: inputs.validate_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
          BUILD_RUN: ${{ needs.plan.outputs.build_run }}
        run: |
          python release-tools/scripts/assemble-release.py --plan --build-run "$BUILD_RUN" --require-unpublished
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-assets/RELEASE-NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release-assets/"* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: assembled-release
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
  publish:
    needs: [plan, assemble]
    if: needs.plan.outputs.release == 'true' && inputs.validate_only != true
    permissions:
      contents: write
      actions: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      publish: true
    secrets: inherit
