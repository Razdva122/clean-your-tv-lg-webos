name: Sign and publish release
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag (bundles and BUILD-INFO must already exist)
        required: true
        type: string
      publish:
        description: Upload signed feeds and publish (false validates without changing release assets)
        type: boolean
        default: true
      candidate_build_run:
        description: 'Root QA only: successful release/next cytv build run; requires publish=false'
        type: string
        default: ''
      direct_tv_qa:
        description: 'Use the explicit direct Root TV candidate artifact; requires preliminary_root_qa and publish=false'
        type: boolean
        default: false
      preliminary_root_qa:
        description: 'Preliminary Root device QA before full validation; never final acceptance; publish must be false'
        type: boolean
        default: false
      candidate_source_sha:
        description: 'Preliminary only: exact 40-character candidate build source SHA'
        type: string
        default: ''
      candidate_branch:
        description: 'Preliminary only: explicitly selected source branch name (no refs or tags)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-signing
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !inputs.candidate_build_run && !inputs.preliminary_root_qa && !inputs.candidate_source_sha && !inputs.candidate_branch && !inputs.direct_tv_qa
    environment: release-signing
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check signing and package regressions
        run: |
          node tests/system_updates/signing.cjs
          node tests/updates/sign-release-feeds.cjs
          node tests/updates/release-feed.cjs
          python -m unittest discover -s tests/setup -p test_release_feeds.py
      - name: Generate and sign compatible system and legacy feeds from exact release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/prepare-release.py "$RELEASE_TAG" "$RUNNER_TEMP/signed-release"
      - name: Upload, verify and publish
        id: publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/signed-release/"* --clobber
          node scripts/publish-release.cjs "$RELEASE_TAG" --publish-verified
          node scripts/publish-release.cjs "$RELEASE_TAG" --check-only
      - name: Save public signed feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-feeds
          path: ${{ runner.temp }}/signed-release/
          if-no-files-found: error
      - name: Start the next cycle and open its draft after verified publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release-flow.py start-cycle --tag "$RELEASE_TAG"
      - name: Notify shipped pull requests and issues after verified publication
        if: inputs.publish && !cancelled() && steps.publication.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release-flow.py notify --tag "$RELEASE_TAG"

  root-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next' && inputs.publish == false && inputs.candidate_build_run != ''
    environment: release-signing
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa-tools
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify QA admission and signing regression tests without a release key
        working-directory: qa-tools
        run: |
          python -m unittest discover -s tests/setup -p test_root_candidate_feeds.py
          node tests/updates/root-candidate-signing.cjs
          python -m unittest discover -s tests/setup -p test_direct_tv_candidate.py
      - name: Install legacy CLI archive reader only for CLI candidates
        if: inputs.direct_tv_qa == false
        run: python -m pip install pyinstaller==6.22.3
      - name: Admit an exact successful unpublished candidate build
        id: candidate
        working-directory: qa-tools
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.candidate_build_run }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRELIMINARY: ${{ inputs.preliminary_root_qa }}
          DIRECT_TV: ${{ inputs.direct_tv_qa }}
          SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          SOURCE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          args=()
          if [ "$DIRECT_TV" = true ]; then
            [ "$PRELIMINARY" = true ] || { echo "Direct TV builds are preliminary QA only"; exit 1; }
            args+=(--direct-tv)
          fi
          if [ "$PRELIMINARY" = true ]; then
            args+=(--preliminary --source-sha "$SOURCE_SHA" --branch "$SOURCE_BRANCH")
          else
            [ -z "$SOURCE_SHA" ] && [ -z "$SOURCE_BRANCH" ] || { echo 'Source options require explicit preliminary QA'; exit 1; }
          fi
          python scripts/root-candidate-feeds.py inspect --run-id "$BUILD_RUN" --tag "$RELEASE_TAG" --metadata "$RUNNER_TEMP/root-candidate.json" "${args[@]}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.source }}
          path: candidate-source
          persist-credentials: false
      - name: Verify exact archive and prepare only Root packages before exposing the key
        working-directory: qa-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/root-candidate-feeds.py prepare --metadata "$RUNNER_TEMP/root-candidate.json" --source ../candidate-source --output "$RUNNER_TEMP/signed-root-candidate"
      - name: Sign and verify only the admitted Root manifest
        working-directory: qa-tools
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: node scripts/sign-root-candidate.cjs "$RUNNER_TEMP/signed-root-candidate"
      - name: Refuse changed build attempts or archives before artifact delivery
        working-directory: qa-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/root-candidate-feeds.py recheck --metadata "$RUNNER_TEMP/root-candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-root-candidate-${{ inputs.candidate_build_run }}-${{ steps.candidate.outputs.attempt }}
          path: ${{ runner.temp }}/signed-root-candidate/
          if-no-files-found: error
