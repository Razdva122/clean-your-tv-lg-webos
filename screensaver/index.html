<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src http://127.0.0.1:*; img-src 'self' http://127.0.0.1:*; media-src 'self' http://127.0.0.1:*"
    />
    <title>Clean Your TV Screensaver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img id="photo" alt="" hidden />
    <video id="video" muted loop playsinline hidden></video>
    <div id="ambient" hidden>
      <div></div>
      <div></div>
    </div>
    <div id="clock" hidden>
      <div id="clockTime"></div>
      <div id="clockDate" hidden></div>
    </div>
    <script src="settings.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
