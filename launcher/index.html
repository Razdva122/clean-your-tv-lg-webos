<!doctype html>
<html lang="en">
  <head>
    <script>
      window.CYTV_HOME_HOST = "card";
    </script>
    <meta charset="utf-8" />
    <title>Home</title>
    <link rel="stylesheet" href="tv-name.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="theme-defaults.css" />
    <link rel="stylesheet" href="renewal-panel.css" />
    <link rel="stylesheet" href="i18n.css" />
    <link rel="stylesheet" href="layout-panel.css" />
    <link rel="stylesheet" href="theme-panel.css" />
    <link rel="stylesheet" href="wallpaper.css" />
    <link rel="stylesheet" href="wallpaper-panel.css" />
    <link rel="stylesheet" href="weather.css" />
  </head>
  <body>
    <div id="tvNameLoading" role="status">
      <h1 id="tvNameLoadingTitle">Home</h1>
      <p data-i18n="Loading…">Loading…</p>
    </div>
    <script src="tv-name-config.js"></script>
    <script src="tv-name.js"></script>
    <div id="homeSurface" class="ctv-home ctv-starting">
      <!-- Ambient glow in the colour of the focused dock app; two layers so colours crossfade. -->
      <div id="ambientA" class="ambient ctv-ambient"></div>
      <div id="ambientB" class="ambient ctv-ambient"></div>

      <!-- Top shelf: the focused dock app's name, above the dock. -->
      <div id="hero" class="ctv-hero"></div>

      <header class="ctv-header">
        <div id="leftBlock">
          <div id="greeting" class="ctv-greeting"></div>
          <div id="timeRow">
            <span id="clock" class="ctv-clock"></span
            ><span id="ampm" class="ctv-period"></span
            ><span class="divider ctv-divider"></span
            ><span id="date" class="ctv-date"></span>
          </div>
        </div>
        <div id="topButtons">
          <div class="pill ctv-shortcut" id="btnInputs">
            <svg class="ctv-input-icon" aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z"
              />
            </svg>
            <span data-i18n="Inputs">Inputs</span>
          </div>
          <div class="pill ctv-shortcut" id="btnWifi">
            <svg
              class="ctv-network-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
            >
              <path
                d="M1,9l2,2c4.97,-4.97 13.030,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"
              />
            </svg>
            <span id="wifiLabel">Wi-Fi</span>
          </div>
          <div class="pill ctv-shortcut" id="btnSettings">
            <svg
              class="ctv-settings-icon"
              aria-hidden="true"
              viewBox="0 0 24 24"
            >
              <path
                d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.030,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.030,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.030,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"
              />
            </svg>
            <span data-i18n="Settings">Settings</span>
          </div>
        </div>
      </header>

      <!-- Everything below the header scrolls together: dock band, tiles and the glass highlight. -->
      <div id="viewport">
        <span
          id="ribbonPosition"
          class="ctv-position"
          aria-hidden="true"
        ></span>
        <div id="stage">
          <!-- Classic Inputs shelf: one press above the dock, live status when the TV reports it. -->
          <section id="inputShelf" class="ctv-input-shelf" hidden>
            <div id="inputShelfCaption" data-i18n="Inputs">Inputs</div>
            <div id="inputShelfWindow"><div id="inputShelfTrack"></div></div>
          </section>
          <div id="dockBand" class="ctv-dock"></div>
          <div id="tiles"></div>
          <div id="glass" class="ctv-focus"></div>
        </div>
      </div>

      <!-- Dropdown under the Inputs pill. -->
      <div id="inputsPanel" class="hidden ctv-inputs"></div>
    </div>

    <div id="toast"></div>

    <script src="viewport.js"></script>
    <script src="theme-policy.js"></script>
    <script src="wallpaper.js"></script>
    <script src="theme-runtime.js"></script>
    <script src="config.js"></script>
    <script src="i18n.js"></script>
    <script src="catalogs.js"></script>
    <script src="tv-name-locales.js"></script>
    <script src="apps.js"></script>
    <script src="app-library.js"></script>
    <script src="input-sources.js"></script>
    <script src="input-preview.js"></script>
    <script src="home-layout.js"></script>
    <script src="layout-panel.js"></script>
    <script src="theme-locales.js"></script>
    <script src="theme-data.js"></script>
    <script src="theme-store.js"></script>
    <script src="wallpaper-media-cache.js"></script>
    <script src="wallpaper-library.js"></script>
    <script src="wallpaper-stream.js"></script>
    <script src="personal-wallpaper.js"></script>
    <script src="wallpaper-qr.js"></script>
    <script src="theme-manager.js"></script>
    <script src="theme-receiver.js"></script>
    <script src="theme-panel.js"></script>
    <script src="user-data.js"></script>
    <script src="release-notes.js"></script>
    <script src="system-updates.js"></script>
    <script src="update-panel.js"></script>
    <script src="wallpaper-locales.js"></script>
    <script src="wallpaper-panel.js"></script>
    <script src="weather-locales.js"></script>
    <script src="weather-data.js"></script>
    <script src="weather-icons.js"></script>
    <script src="weather-transport.js"></script>
    <script src="weather.js"></script>
    <script src="settings-categories.js"></script>
    <script src="renewal-panel.js"></script>
    <script src="helper-control.js"></script>
    <script src="profile-bootstrap.js"></script>
  </body>
</html>
